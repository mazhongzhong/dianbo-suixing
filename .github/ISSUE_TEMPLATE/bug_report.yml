name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Select a station
        3. Tap Play
    validations:
      required: true
  - type: input
    attributes:
      label: Android and app versions
      placeholder: Android 15, UK Radio Companion 0.5.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add screenshots or logs with sensitive information removed.
